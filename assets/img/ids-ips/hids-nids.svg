<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490">
  <rect width="760" height="490" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="720" height="450" rx="14" fill="#ffffff" stroke="#cbd5e1"/>

  <g font-family="Arial, sans-serif" text-anchor="middle">

    <!-- External Network -->
    <rect x="240" y="40" width="280" height="52" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="380" y="72" font-size="20" font-weight="bold" fill="#334155">외부 네트워크</text>

    <!-- Network Switch -->
    <path d="M380 92 V125" stroke="#64748b" stroke-width="3"/>
    <rect x="265" y="125" width="230" height="55" rx="8" fill="#334155"/>
    <text x="380" y="159" font-size="20" font-weight="bold" fill="#ffffff">Network Switch</text>

    <!-- NIDS -->
    <path d="M495 152 H555" stroke="#16a34a" stroke-width="3" stroke-dasharray="7 5"/>
    <polygon points="555,152 545,146 545,158" fill="#16a34a"/>
    <rect x="555" y="115" width="155" height="76" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="632" y="145" font-size="24" font-weight="bold" fill="#15803d">NIDS</text>
    <text x="632" y="169" font-size="15" fill="#166534">트래픽 감시</text>
    <text x="632" y="209" font-size="13" fill="#15803d">복제 트래픽 분석</text>

    <!-- Network Connections -->
    <path d="M380 180 V230 H155 V275
             M380 230 V275
             M380 230 H605 V275"
          fill="none" stroke="#64748b" stroke-width="3"/>

    <!-- Web Server -->
    <rect x="50" y="275" width="210" height="135" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="155" y="304" font-size="19" font-weight="bold" fill="#334155">Web Server</text>
    <rect x="65" y="320" width="180" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="155" y="346" font-size="21" font-weight="bold" fill="#1d4ed8">HIDS Agent</text>
    <text x="155" y="385" font-size="15" fill="#475569">파일 · 로그 · 프로세스</text>

    <!-- DB Server -->
    <rect x="275" y="275" width="210" height="135" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="380" y="304" font-size="19" font-weight="bold" fill="#334155">DB Server</text>
    <rect x="290" y="320" width="180" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="380" y="346" font-size="21" font-weight="bold" fill="#1d4ed8">HIDS Agent</text>
    <text x="380" y="385" font-size="15" fill="#475569">파일 · 로그 · 프로세스</text>

    <!-- Employee PC -->
    <rect x="500" y="275" width="210" height="135" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="605" y="304" font-size="19" font-weight="bold" fill="#334155">Employee PC</text>
    <rect x="515" y="320" width="180" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="605" y="346" font-size="21" font-weight="bold" fill="#1d4ed8">HIDS Agent</text>
    <text x="605" y="385" font-size="15" fill="#475569">파일 · 로그 · 프로세스</text>

    <!-- Legend -->
    <rect x="85" y="438" width="16" height="16" rx="3" fill="#16a34a"/>
    <text x="111" y="451" font-size="15" text-anchor="start" fill="#334155">NIDS — 네트워크 트래픽</text>

    <rect x="400" y="438" width="16" height="16" rx="3" fill="#2563eb"/>
    <text x="426" y="451" font-size="15" text-anchor="start" fill="#334155">HIDS — 호스트 내부 활동</text>

  </g>
</svg>
