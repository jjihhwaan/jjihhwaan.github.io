<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530">
  <rect width="760" height="530" rx="16" fill="#f8fafc"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#16a34a"/>
    </marker>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/>
    </marker>
    <marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif" text-anchor="middle">

    <!-- IDS Section -->
    <rect x="20" y="20" width="720" height="235" rx="12"
          fill="#ffffff" stroke="#cbd5e1"/>

    <text x="45" y="53" text-anchor="start" font-size="23"
          font-weight="bold" fill="#2563eb">IDS — Out-of-band</text>

    <text x="45" y="77" text-anchor="start" font-size="15"
          fill="#64748b">원본 트래픽의 전달 경로 밖에서 감시</text>

    <!-- Client -->
    <rect x="55" y="105" width="140" height="55" rx="8"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="125" y="139" font-size="20" fill="#334155">Client</text>

    <!-- Switch -->
    <rect x="310" y="105" width="140" height="55" rx="8" fill="#334155"/>
    <text x="380" y="139" font-size="20" fill="#ffffff">Switch</text>

    <!-- Server -->
    <rect x="565" y="105" width="140" height="55" rx="8"
          fill="#dcfce7" stroke="#16a34a"/>
    <text x="635" y="139" font-size="20" fill="#166534">Server</text>

    <!-- Original Traffic -->
    <path d="M195 132 H302" stroke="#64748b" stroke-width="3"
          marker-end="url(#arrow)"/>
    <path d="M450 132 H557" stroke="#16a34a" stroke-width="3"
          marker-end="url(#green)"/>

    <text x="252" y="119" font-size="13" fill="#64748b">원본 트래픽</text>
    <text x="507" y="119" font-size="13" fill="#15803d">서버로 전달</text>

    <!-- IDS Sensor -->
    <path d="M380 160 V191" stroke="#2563eb" stroke-width="3"
          stroke-dasharray="6 4" marker-end="url(#blue)"/>

    <rect x="285" y="195" width="190" height="43" rx="7"
          fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="380" y="222" font-size="21" font-weight="bold"
          fill="#1d4ed8">IDS</text>

    <text x="475" y="181" font-size="14" fill="#2563eb">복제 트래픽</text>
    <text x="490" y="222" text-anchor="start" font-size="15"
          fill="#334155">경고 및 로그 생성</text>

    <!-- IPS Section -->
    <rect x="20" y="275" width="720" height="235" rx="12"
          fill="#ffffff" stroke="#cbd5e1"/>

    <text x="45" y="308" text-anchor="start" font-size="23"
          font-weight="bold" fill="#15803d">IPS — Inline</text>

    <text x="45" y="332" text-anchor="start" font-size="15"
          fill="#64748b">원본 트래픽의 전달 경로에서 직접 검사</text>

    <!-- Client -->
    <rect x="55" y="360" width="140" height="55" rx="8"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="125" y="394" font-size="20" fill="#334155">Client</text>

    <!-- IPS -->
    <rect x="310" y="360" width="140" height="55" rx="8"
          fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="394" font-size="23" font-weight="bold"
          fill="#15803d">IPS</text>

    <!-- Server -->
    <rect x="565" y="360" width="140" height="55" rx="8"
          fill="#dcfce7" stroke="#16a34a"/>
    <text x="635" y="394" font-size="20" fill="#166534">Server</text>

    <!-- Traffic -->
    <path d="M195 387 H302" stroke="#64748b" stroke-width="3"
          marker-end="url(#arrow)"/>
    <path d="M450 387 H557" stroke="#16a34a" stroke-width="3"
          marker-end="url(#green)"/>

    <text x="252" y="374" font-size="13" fill="#64748b">원본 트래픽</text>
    <text x="507" y="374" font-size="13" fill="#15803d">허용 트래픽</text>

    <!-- Blocked Traffic -->
    <path d="M380 415 V449" stroke="#dc2626" stroke-width="3"
          marker-end="url(#red)"/>

    <rect x="285" y="453" width="190" height="40" rx="7"
          fill="#fee2e2" stroke="#dc2626"/>
    <text x="380" y="479" font-size="18" font-weight="bold"
          fill="#991b1b">패킷 차단</text>

    <text x="474" y="438" font-size="14" fill="#dc2626">차단 대상</text>
    <text x="490" y="479" text-anchor="start" font-size="15"
          fill="#334155">서버로 전달하지 않음</text>

  </g>
</svg>
