<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500">
  <rect width="760" height="500" rx="16" fill="#f8fafc"/>

  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse"
            markerWidth="10" markerHeight="10"
            refX="10" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif" text-anchor="middle">

    <!-- HTTP Panel -->
    <rect x="20" y="20" width="720" height="220" rx="12"
          fill="#ffffff" stroke="#cbd5e1"/>

    <text x="45" y="53" text-anchor="start" font-size="23"
          font-weight="bold" fill="#334155">HTTP — 평문 통신</text>

    <rect x="45" y="85" width="130" height="55" rx="8"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="110" y="119" font-size="19" fill="#334155">Client</text>

    <rect x="305" y="85" width="150" height="55" rx="8"
          fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="380" y="110" font-size="19" font-weight="bold" fill="#1d4ed8">IDS/IPS</text>
    <text x="380" y="128" font-size="12" fill="#1e40af">네트워크 감시 지점</text>

    <rect x="585" y="85" width="130" height="55" rx="8"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="650" y="119" font-size="19" fill="#334155">Server</text>

    <path d="M175 113 H300" stroke="#64748b"
          stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M455 113 H580" stroke="#64748b"
          stroke-width="2.5" marker-end="url(#arrow)"/>

    <text x="237.5" y="97" font-size="13" fill="#475569">평문 데이터</text>
    <text x="517.5" y="97" font-size="13" fill="#475569">평문 데이터</text>

    <path d="M380 140 V165" stroke="#16a34a"
          stroke-width="2" stroke-dasharray="5 4"/>

    <rect x="150" y="165" width="460" height="55" rx="8"
          fill="#dcfce7" stroke="#16a34a"/>

    <text x="380" y="188" font-size="19" font-weight="bold"
          fill="#166534">HTTP 요청 내용 확인 가능</text>
    <text x="380" y="208" font-size="14" fill="#166534">
      알려진 공격 문자열 및 요청 내용 검사
    </text>

    <!-- HTTPS Panel -->
    <rect x="20" y="260" width="720" height="220" rx="12"
          fill="#ffffff" stroke="#cbd5e1"/>

    <text x="45" y="293" text-anchor="start" font-size="23"
          font-weight="bold" fill="#334155">HTTPS — 암호화 통신</text>

    <rect x="45" y="325" width="130" height="55" rx="8"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="110" y="359" font-size="19" fill="#334155">Client</text>

    <rect x="305" y="325" width="150" height="55" rx="8"
          fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="380" y="350" font-size="19" font-weight="bold" fill="#1d4ed8">IDS/IPS</text>
    <text x="380" y="368" font-size="12" fill="#1e40af">네트워크 감시 지점</text>

    <rect x="585" y="325" width="130" height="55" rx="8"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="650" y="359" font-size="19" fill="#334155">Server</text>

    <path d="M175 353 H300" stroke="#64748b"
          stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M455 353 H580" stroke="#64748b"
          stroke-width="2.5" marker-end="url(#arrow)"/>

    <text x="237.5" y="337" font-size="13" fill="#475569">암호화 데이터</text>
    <text x="517.5" y="337" font-size="13" fill="#475569">암호화 데이터</text>

    <path d="M380 380 V405" stroke="#dc2626"
          stroke-width="2" stroke-dasharray="5 4"/>

    <rect x="150" y="405" width="460" height="55" rx="8"
          fill="#fee2e2" stroke="#dc2626"/>

    <text x="380" y="428" font-size="19" font-weight="bold"
          fill="#991b1b">암호화된 요청 내용 직접 검사 불가</text>
    <text x="380" y="448" font-size="14" fill="#991b1b">
      IP 주소, 패킷 크기, 통신 패턴 등은 분석 가능
    </text>

  </g>
</svg>
