<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590">
  <rect width="760" height="590" rx="16" fill="#f8fafc"/>

  <defs>
  <marker id="greenArrow" markerUnits="userSpaceOnUse"
          markerWidth="10" markerHeight="10"
          refX="10" refY="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/>
  </marker>

  <marker id="grayArrow" markerUnits="userSpaceOnUse"
          markerWidth="10" markerHeight="10"
          refX="10" refY="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
  </marker>
</defs>

  <g font-family="Arial, sans-serif" text-anchor="middle">

    <!-- Fail-open Panel -->
    <rect x="20" y="20" width="350" height="550" rx="12"
          fill="#ffffff" stroke="#cbd5e1"/>

    <rect x="35" y="35" width="320" height="65" rx="8"
          fill="#dcfce7"/>
    <text x="195" y="64" font-size="25" font-weight="bold"
          fill="#15803d">Fail-open</text>
    <text x="195" y="86" font-size="15" fill="#166534">가용성 우선</text>

    <rect x="105" y="125" width="180" height="45" rx="7"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="195" y="153" font-size="18" fill="#334155">네트워크 트래픽</text>

    <rect x="105" y="220" width="180" height="55" rx="8"
          fill="#fee2e2" stroke="#dc2626"/>
    <text x="195" y="253" font-size="20" font-weight="bold"
          fill="#991b1b">IPS 장애 ✕</text>

    <path d="M195 170 V190 H320 V300 H195 V323"
          fill="none" stroke="#16a34a" stroke-width="3"
          marker-end="url(#greenArrow)"/>

    <text x="302" y="215" text-anchor="end" font-size="13"
          fill="#15803d">우회</text>

    <rect x="105" y="330" width="180" height="45" rx="7"
          fill="#dcfce7" stroke="#16a34a"/>
    <text x="195" y="358" font-size="20" font-weight="bold"
          fill="#166534">Server</text>

    <text x="195" y="409" font-size="19" font-weight="bold"
          fill="#15803d">통신 유지</text>
    <text x="195" y="435" font-size="15" fill="#dc2626">보안 검사 중단 및 보안 공백</text>

    <path d="M45 456 H345" stroke="#e2e8f0"/>

    <text x="195" y="483" font-size="14" fill="#64748b">적용 고려 사례</text>
    <text x="195" y="512" font-size="20" font-weight="bold"
          fill="#334155">대학교 수강신청 서버</text>
    <text x="195" y="538" font-size="15" fill="#475569">정상적인 서비스 이용을 우선</text>

    <!-- Fail-closed Panel -->
    <rect x="390" y="20" width="350" height="550" rx="12"
          fill="#ffffff" stroke="#cbd5e1"/>

    <rect x="405" y="35" width="320" height="65" rx="8"
          fill="#dbeafe"/>
    <text x="565" y="64" font-size="25" font-weight="bold"
          fill="#1d4ed8">Fail-closed</text>
    <text x="565" y="86" font-size="15" fill="#1e40af">보안 정책 우선</text>

    <rect x="475" y="125" width="180" height="45" rx="7"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="565" y="153" font-size="18" fill="#334155">네트워크 트래픽</text>

    <path d="M565 170 V211" stroke="#64748b" stroke-width="3"
          marker-end="url(#grayArrow)"/>

    <rect x="475" y="220" width="180" height="55" rx="8"
          fill="#fee2e2" stroke="#dc2626"/>
    <text x="565" y="253" font-size="20" font-weight="bold"
          fill="#991b1b">IPS 장애 ✕</text>

    <path d="M565 275 V294" stroke="#dc2626"
          stroke-width="2" stroke-dasharray="5 4"/>

    <circle cx="565" cy="307" r="13" fill="#dc2626"/>
    <path d="M559 301 L571 313 M571 301 L559 313"
          stroke="#ffffff" stroke-width="3"/>

    <rect x="475" y="330" width="180" height="45" rx="7"
          fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="565" y="358" font-size="20" font-weight="bold"
          fill="#94a3b8">Server</text>

    <text x="565" y="409" font-size="19" font-weight="bold"
          fill="#1d4ed8">검사되지 않은 통신 차단</text>
    <text x="565" y="435" font-size="15" fill="#dc2626">정상 서비스 중단 가능</text>

    <path d="M415 456 H715" stroke="#e2e8f0"/>

    <text x="565" y="483" font-size="14" fill="#64748b">적용 고려 사례</text>
    <text x="565" y="512" font-size="20" font-weight="bold"
          fill="#334155">군사기밀 처리 네트워크</text>
    <text x="565" y="538" font-size="15" fill="#475569">기밀정보 보호를 우선</text>

  </g>
</svg>
