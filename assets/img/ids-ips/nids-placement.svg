<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540">
  <rect width="760" height="540" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="720" height="500" rx="12"
        fill="#ffffff" stroke="#cbd5e1"/>

  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse"
            markerWidth="10" markerHeight="10"
            refX="10" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif" text-anchor="middle">

    <!-- Internet -->
    <rect x="65" y="45" width="250" height="55" rx="9"
          fill="#f1f5f9" stroke="#94a3b8"/>

    <text x="190" y="79" font-size="22" font-weight="bold"
          fill="#334155">Internet</text>

    <!-- External Traffic -->
    <path d="M190 100 V220"
          stroke="#64748b" stroke-width="3"
          marker-end="url(#arrow)"/>

    <!-- External NIDS -->
    <path d="M190 157 H380"
          stroke="#16a34a" stroke-width="3"
          stroke-dasharray="7 5"/>

    <rect x="380" y="110" width="325" height="95" rx="9"
          fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>

    <text x="542.5" y="139" font-size="21"
          font-weight="bold" fill="#15803d">
      ① 방화벽 외부 NIDS
    </text>

    <text x="542.5" y="165" font-size="16" fill="#166534">
      방화벽 도달 전 트래픽 분석
    </text>

    <text x="542.5" y="187" font-size="14" fill="#166534">
      차단될 공격 시도까지 관찰
    </text>

    <!-- Firewall -->
    <rect x="65" y="225" width="250" height="90" rx="8"
          fill="#334155"/>

    <text x="190" y="252" font-size="21"
          font-weight="bold" fill="#ffffff">Firewall</text>

    <!-- Firewall Brick Pattern -->
    <g stroke="#94a3b8" stroke-width="1.8">
      <path d="M90 270 H290 M90 285 H290"/>
      <path d="M125 260 V270 M190 260 V270 M255 260 V270"/>
      <path d="M155 270 V285 M225 270 V285"/>
      <path d="M125 285 V295 M190 285 V295 M255 285 V295"/>
    </g>

    <!-- Blocked Traffic -->
    <path d="M65 270 H47"
          stroke="#dc2626" stroke-width="2.5"/>

    <path d="M35 264 L47 276 M47 264 L35 276"
          stroke="#dc2626" stroke-width="2.5"
          stroke-linecap="round"/>

    <!-- Internal Traffic -->
    <path d="M190 315 V435"
          stroke="#64748b" stroke-width="3"
          marker-end="url(#arrow)"/>

    <!-- Firewall Description -->
    <text x="210" y="337" text-anchor="start"
          font-size="14" fill="#64748b">
      접근 제어 정책 적용
    </text>

    <!-- Internal NIDS -->
    <path d="M190 372 H380"
          stroke="#16a34a" stroke-width="3"
          stroke-dasharray="7 5"/>

    <rect x="380" y="325" width="325" height="95" rx="9"
          fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>

    <text x="542.5" y="354" font-size="21"
          font-weight="bold" fill="#15803d">
      ② 방화벽 내부 NIDS
    </text>

    <text x="542.5" y="380" font-size="16" fill="#166534">
      방화벽 통과 트래픽 분석
    </text>

    <text x="542.5" y="402" font-size="14" fill="#166534">
      실제 유입되는 위협에 집중
    </text>

    <!-- Internal Network -->
    <rect x="65" y="440" width="250" height="55" rx="8"
          fill="#dbeafe" stroke="#2563eb"/>

    <text x="190" y="474" font-size="20"
          font-weight="bold" fill="#1d4ed8">
      Internal Network
    </text>

    <!-- Legend -->
    <path d="M390 467 H430"
          stroke="#16a34a" stroke-width="3"
          stroke-dasharray="7 5"/>

    <text x="445" y="472" text-anchor="start"
          font-size="15" fill="#475569">
      복제 트래픽
    </text>

  </g>
</svg>
