<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520">
  <rect width="760" height="520" rx="16" fill="#f8fafc"/>
  <rect x="24" y="24" width="712" height="472" rx="14" fill="#ffffff" stroke="#cbd5e1"/>

  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif">
    <text x="42" y="58" font-size="24" font-weight="bold" fill="#1e293b">방화벽 기준 NIDS 설치 위치 비교</text>
    <text x="42" y="82" font-size="14" fill="#64748b">방화벽 외부와 내부에서 NIDS가 관찰하는 트래픽의 범위를 비교한 구성도</text>

    <!-- Left flow -->
    <rect x="70" y="110" width="210" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="175" y="145" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">Internet</text>

    <path d="M175 166 V226" stroke="#64748b" stroke-width="4" marker-end="url(#arrowGray)"/>

    <rect x="70" y="240" width="210" height="74" rx="10" fill="#334155"/>
    <text x="175" y="272" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Firewall</text>
    <g stroke="#94a3b8" stroke-width="2.3">
      <path d="M92 286 H258"/>
      <path d="M92 302 H258"/>
      <path d="M125 270 V286 M175 270 V286 M225 270 V286"/>
      <path d="M108 286 V302 M158 286 V302 M208 286 V302"/>
      <path d="M125 302 V314 M175 302 V314 M225 302 V314"/>
    </g>

    <!-- blocked sign -->
    <path d="M50 277 H70" stroke="#ef4444" stroke-width="4"/>
    <path d="M52 260 L66 294 M66 260 L52 294" stroke="#ef4444" stroke-width="4"/>

    <text x="175" y="340" text-anchor="middle" font-size="14" fill="#64748b">접근 제어 정책 적용</text>

    <path d="M175 314 V390" stroke="#64748b" stroke-width="4" marker-end="url(#arrowGray)"/>

    <rect x="70" y="404" width="210" height="56" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="175" y="439" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d4ed8">Internal Network</text>

    <!-- Right upper box -->
    <path d="M175 200 H340" stroke="#16a34a" stroke-width="4" stroke-dasharray="10 7"/>
    <rect x="360" y="150" width="320" height="96" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="520" y="184" text-anchor="middle" font-size="20" font-weight="bold" fill="#15803d">① 방화벽 외부 NIDS</text>
    <text x="520" y="212" text-anchor="middle" font-size="16" fill="#166534">방화벽 도달 전 트래픽 분석</text>
    <text x="520" y="236" text-anchor="middle" font-size="16" fill="#166534">차단될 공격 시도까지 관찰 가능</text>

    <!-- Right lower box -->
    <path d="M175 370 H340" stroke="#16a34a" stroke-width="4" stroke-dasharray="10 7"/>
    <rect x="360" y="320" width="320" height="96" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="520" y="354" text-anchor="middle" font-size="20" font-weight="bold" fill="#15803d">② 방화벽 내부 NIDS</text>
    <text x="520" y="382" text-anchor="middle" font-size="16" fill="#166534">방화벽 통과 트래픽 분석</text>
    <text x="520" y="406" text-anchor="middle" font-size="16" fill="#166534">실제 유입되는 위협에 집중</text>

    <!-- legend -->
    <path d="M370 454 H430" stroke="#16a34a" stroke-width="4" stroke-dasharray="10 7"/>
    <text x="442" y="460" font-size="15" fill="#334155">복제 트래픽</text>
  </g>
</svg>
