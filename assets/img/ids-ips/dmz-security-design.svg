<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760">
  <rect width="760" height="760" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="720" height="720" rx="14" fill="#ffffff" stroke="#cbd5e1"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <marker id="greenArrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif" text-anchor="middle">

    <!-- Title -->
    <text x="380" y="53" font-size="23" font-weight="bold"
          fill="#1e293b">IDS/IPS 기반 DMZ 보안 구성</text>

    <!-- Internet -->
    <rect x="95" y="75" width="240" height="45" rx="8"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="215" y="104" font-size="20" font-weight="bold"
          fill="#334155">Internet</text>

    <path d="M215 120 V140" stroke="#64748b" stroke-width="3"/>

    <!-- External Firewall -->
    <rect x="95" y="140" width="240" height="45" rx="7"
          fill="#334155"/>
    <text x="215" y="169" font-size="19" font-weight="bold"
          fill="#ffffff">외부 방화벽</text>

    <path d="M215 185 V290" stroke="#64748b" stroke-width="3"/>

    <!-- NIDS -->
    <path d="M215 230 H410"
          stroke="#16a34a" stroke-width="3"
          stroke-dasharray="7 5" marker-end="url(#greenArrow)"/>

    <text x="315" y="218" font-size="14" fill="#15803d">
      복제 트래픽
    </text>

    <rect x="420" y="190" width="280" height="90" rx="9"
          fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>

    <text x="560" y="220" font-size="23" font-weight="bold"
          fill="#15803d">① NIDS</text>
    <text x="560" y="246" font-size="16" fill="#166534">
      방화벽 통과 트래픽 감시
    </text>
    <text x="560" y="266" font-size="14" fill="#166534">
      외부에서 유입되는 위협 탐지
    </text>

    <!-- DMZ Zone -->
    <rect x="45" y="290" width="670" height="185" rx="12"
          fill="#fffbeb" stroke="#d97706" stroke-width="2"/>

    <text x="65" y="320" text-anchor="start" font-size="23"
          font-weight="bold" fill="#92400e">DMZ</text>

    <!-- Web Server -->
    <rect x="80" y="335" width="270" height="120" rx="9"
          fill="#ffffff" stroke="#94a3b8"/>

    <text x="215" y="363" font-size="19" font-weight="bold"
          fill="#334155">Web Server</text>

    <!-- HIDS -->
    <rect x="100" y="378" width="230" height="45" rx="7"
          fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>

    <text x="215" y="407" font-size="21" font-weight="bold"
          fill="#1d4ed8">② HIDS Agent</text>

    <text x="215" y="442" font-size="14" fill="#475569">
      파일 · 로그 · 프로세스
    </text>

    <text x="525" y="367" font-size="18" font-weight="bold"
          fill="#1d4ed8">서버 내부 활동 감시</text>
    <text x="525" y="394" font-size="16" fill="#475569">
      악성 파일 생성
    </text>
    <text x="525" y="419" font-size="16" fill="#475569">
      비정상적인 프로세스 실행
    </text>
    <text x="525" y="444" font-size="16" fill="#475569">
      침해 흔적 탐지
    </text>

    <path d="M215 290 V335 M215 455 V500"
          stroke="#64748b" stroke-width="3"/>

    <!-- Internal Firewall -->
    <rect x="95" y="500" width="240" height="45" rx="7"
          fill="#334155"/>

    <text x="215" y="529" font-size="19" font-weight="bold"
          fill="#ffffff">내부 방화벽</text>

    <text x="365" y="529" text-anchor="start"
          font-size="15" fill="#475569">업무에 필요한 통신만 허용</text>

    <path d="M215 545 V565" stroke="#64748b" stroke-width="3"/>

    <!-- NIPS -->
    <rect x="95" y="565" width="240" height="55" rx="8"
          fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>

    <text x="215" y="599" font-size="23" font-weight="bold"
          fill="#991b1b">③ NIPS</text>

    <text x="365" y="585" text-anchor="start"
          font-size="17" font-weight="bold" fill="#991b1b">
      내부로의 공격 확산 방지
    </text>
    <text x="365" y="609" text-anchor="start"
          font-size="15" fill="#475569">
      위협 탐지 및 자동 차단
    </text>

    <path d="M215 620 V645" stroke="#64748b" stroke-width="3"
          marker-end="url(#arrow)"/>

    <!-- Internal Network -->
    <rect x="45" y="655" width="670" height="65" rx="10"
          fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>

    <text x="380" y="681" font-size="21" font-weight="bold"
          fill="#1d4ed8">내부 업무 네트워크</text>
    <text x="380" y="705" font-size="16" fill="#334155">
      DB Server · Employee PC · 업무 시스템
    </text>

  </g>
</svg>
