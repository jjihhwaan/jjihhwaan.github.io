<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650">
  <rect width="760" height="650" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="720" height="610" rx="14"
        fill="#ffffff" stroke="#cbd5e1"/>

  <g font-family="Arial, sans-serif">

    <!-- Title -->
    <text x="380" y="55" text-anchor="middle" font-size="24"
          font-weight="bold" fill="#1e293b">Suricata Rule Structure</text>

    <!-- Rule Header -->
    <rect x="40" y="80" width="680" height="160" rx="10"
          fill="#eff6ff" stroke="#2563eb"/>

    <text x="60" y="110" font-size="21" font-weight="bold"
          fill="#1d4ed8">01. Rule Header</text>
    <text x="60" y="132" font-size="14" fill="#475569">
      처리 방식 및 트래픽 검사 대상
    </text>

    <!-- Rule Header Tokens -->
    <g font-family="Consolas, monospace" text-anchor="middle"
       font-size="20" font-weight="bold">

      <rect x="60" y="150" width="100" height="45" rx="6"
            fill="#fee2e2" stroke="#dc2626"/>
      <text x="110" y="179" fill="#991b1b">alert</text>

      <rect x="170" y="150" width="100" height="45" rx="6"
            fill="#dbeafe" stroke="#2563eb"/>
      <text x="220" y="179" fill="#1d4ed8">icmp</text>

      <rect x="280" y="150" width="125" height="45" rx="6"
            fill="#dcfce7" stroke="#16a34a"/>
      <text x="342" y="179" fill="#166534">any any</text>

      <rect x="415" y="150" width="50" height="45" rx="6"
            fill="#e2e8f0" stroke="#94a3b8"/>
      <text x="440" y="179" fill="#475569">-&gt;</text>

      <rect x="475" y="150" width="225" height="45" rx="6"
            fill="#fef3c7" stroke="#d97706"/>
      <text x="587" y="179" fill="#92400e">$HOME_NET any</text>

    </g>

    <g text-anchor="middle" font-size="14" fill="#475569">
      <text x="110" y="219">Action</text>
      <text x="220" y="219">Protocol</text>
      <text x="342" y="219">Source</text>
      <text x="440" y="219">방향</text>
      <text x="587" y="219">Destination</text>
    </g>

    <!-- Rule Options -->
    <rect x="40" y="255" width="680" height="285" rx="10"
          fill="#f0fdf4" stroke="#16a34a"/>

    <text x="60" y="286" font-size="21" font-weight="bold"
          fill="#15803d">02. Rule Options</text>
    <text x="60" y="309" font-size="14" fill="#475569">
      세부 탐지 조건 및 규칙 식별 정보
    </text>

    <g font-family="Consolas, monospace" font-size="17"
       font-weight="bold">

      <rect x="60" y="325" width="375" height="42" rx="6"
            fill="#ffffff" stroke="#86efac"/>
      <text x="75" y="352" fill="#166534">msg:"Ping Detected";</text>

      <rect x="60" y="377" width="375" height="42" rx="6"
            fill="#ffffff" stroke="#86efac"/>
      <text x="75" y="404" fill="#166534">itype:8;</text>

      <rect x="60" y="429" width="375" height="42" rx="6"
            fill="#ffffff" stroke="#86efac"/>
      <text x="75" y="456" fill="#166534">sid:1000001;</text>

      <rect x="60" y="481" width="375" height="42" rx="6"
            fill="#ffffff" stroke="#86efac"/>
      <text x="75" y="508" fill="#166534">rev:1;</text>

    </g>

    <g font-size="17" fill="#334155">
      <text x="455" y="352">경고 메시지</text>
      <text x="455" y="404">ICMP Echo Request</text>
      <text x="455" y="456">규칙 식별 번호</text>
      <text x="455" y="508">규칙 수정 버전</text>
    </g>

    <!-- Summary -->
    <rect x="40" y="555" width="680" height="55" rx="8"
          fill="#f1f5f9" stroke="#cbd5e1"/>

    <text x="380" y="578" text-anchor="middle"
          font-size="17" font-weight="bold" fill="#334155">
      Rule Header + Rule Options
    </text>
    <text x="380" y="599" text-anchor="middle"
          font-size="14" fill="#64748b">
      무엇을 검사하고, 어떤 조건에서 어떻게 대응할 것인가?
    </text>

  </g>
</svg>
