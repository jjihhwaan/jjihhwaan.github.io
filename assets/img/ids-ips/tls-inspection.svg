<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570">
  <rect width="760" height="570" rx="16" fill="#f8fafc"/>

  <defs>
    <marker id="greenArrow" markerUnits="userSpaceOnUse"
            markerWidth="10" markerHeight="10"
            refX="10" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/>
    </marker>

    <marker id="blueArrow" markerUnits="userSpaceOnUse"
            markerWidth="10" markerHeight="10"
            refX="10" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif" text-anchor="middle">

    <!-- Normal HTTPS -->
    <rect x="20" y="20" width="720" height="160" rx="12"
          fill="#ffffff" stroke="#cbd5e1"/>

    <text x="45" y="53" text-anchor="start" font-size="23"
          font-weight="bold" fill="#334155">일반적인 HTTPS 통신</text>

    <rect x="45" y="85" width="130" height="50" rx="8"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="110" y="117" font-size="20" fill="#334155">Client</text>

    <rect x="585" y="85" width="130" height="50" rx="8"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="650" y="117" font-size="20" fill="#334155">Server</text>

    <path d="M175 110 H280"
          stroke="#16a34a" stroke-width="2.5"/>

    <path d="M480 110 H579"
          stroke="#16a34a" stroke-width="2.5"
          marker-end="url(#greenArrow)"/>

    <rect x="280" y="91" width="200" height="38" rx="6"
          fill="#dcfce7" stroke="#16a34a"/>

    <text x="380" y="116" font-size="16" font-weight="bold"
          fill="#166534">암호화된 TLS 연결</text>

    <text x="380" y="159" font-size="14" fill="#64748b">
      중간 장비에서 통신 내용을 직접 확인하기 어려움
    </text>

    <!-- TLS Inspection -->
    <rect x="20" y="200" width="720" height="350" rx="12"
          fill="#ffffff" stroke="#cbd5e1"/>

    <text x="45" y="233" text-anchor="start" font-size="23"
          font-weight="bold" fill="#334155">TLS 복호화 검사 적용</text>

    <!-- Inspection Device -->
    <rect x="260" y="255" width="240" height="270" rx="12"
          fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>

    <text x="380" y="284" font-size="20" font-weight="bold"
          fill="#1d4ed8">TLS 검사 장비</text>

    <!-- Decryption -->
    <rect x="280" y="300" width="200" height="48" rx="7"
          fill="#dbeafe" stroke="#2563eb"/>
    <text x="380" y="320" font-size="18" font-weight="bold"
          fill="#1d4ed8">① 복호화</text>
    <text x="380" y="337" font-size="13" fill="#1e40af">
      암호화된 데이터 해석
    </text>

    <path d="M380 352 V374"
          stroke="#2563eb" stroke-width="2"
          marker-end="url(#blueArrow)"/>

    <!-- Inspection -->
    <rect x="280" y="379" width="200" height="48" rx="7"
          fill="#fef3c7" stroke="#d97706"/>
    <text x="380" y="399" font-size="18" font-weight="bold"
          fill="#92400e">② 내용 검사</text>
    <text x="380" y="416" font-size="13" fill="#92400e">
      공격 패턴 및 위협 분석
    </text>

    <path d="M380 431 V453"
          stroke="#2563eb" stroke-width="2"
          marker-end="url(#blueArrow)"/>

    <!-- Re-encryption -->
    <rect x="280" y="458" width="200" height="48" rx="7"
          fill="#dbeafe" stroke="#2563eb"/>
    <text x="380" y="478" font-size="18" font-weight="bold"
          fill="#1d4ed8">③ 재암호화</text>
    <text x="380" y="495" font-size="13" fill="#1e40af">
      허용된 데이터 보호
    </text>

    <!-- Client -->
    <rect x="45" y="299" width="120" height="50" rx="8"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="105" y="331" font-size="19" fill="#334155">Client</text>

    <path d="M165 324 H254"
          stroke="#16a34a" stroke-width="2.5"
          marker-end="url(#greenArrow)"/>

    <text x="210" y="307" font-size="13" font-weight="bold"
          fill="#15803d">TLS 연결 1</text>

    <!-- Server -->
    <rect x="595" y="457" width="120" height="50" rx="8"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="655" y="489" font-size="19" fill="#334155">Server</text>

    <path d="M480 482 H589"
          stroke="#16a34a" stroke-width="2.5"
          marker-end="url(#greenArrow)"/>

    <text x="547" y="465" font-size="13" font-weight="bold"
          fill="#15803d">TLS 연결 2</text>

  </g>
</svg>
