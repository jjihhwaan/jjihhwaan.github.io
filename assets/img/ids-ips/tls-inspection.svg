<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570">
  <rect width="760" height="570" rx="16" fill="#f8fafc"/>

  <defs>
    <marker id="greenArrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#16a34a"/>
    </marker>
    <marker id="blueArrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif" text-anchor="middle">

    <!-- Normal HTTPS -->
    <rect x="20" y="20" width="720" height="165" rx="12"
          fill="#ffffff" stroke="#cbd5e1"/>

    <text x="45" y="53" text-anchor="start" font-size="23"
          font-weight="bold" fill="#334155">일반적인 HTTPS 통신</text>

    <rect x="50" y="85" width="145" height="55" rx="8"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="122" y="119" font-size="20" fill="#334155">Client</text>

    <rect x="565" y="85" width="145" height="55" rx="8"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="637" y="119" font-size="20" fill="#334155">Server</text>

    <path d="M195 112 H555" stroke="#16a34a" stroke-width="3"
          marker-end="url(#greenArrow)"/>

    <rect x="275" y="93" width="210" height="36" rx="6"
          fill="#dcfce7" stroke="#16a34a"/>

    <text x="380" y="116" font-size="16" font-weight="bold"
          fill="#166534">암호화된 TLS 연결</text>

    <text x="380" y="163" font-size="15" fill="#64748b">
      중간 장비에서 통신 내용을 직접 확인하기 어려움
    </text>

    <!-- TLS Inspection -->
    <rect x="20" y="205" width="720" height="345" rx="12"
          fill="#ffffff" stroke="#cbd5e1"/>

    <text x="45" y="238" text-anchor="start" font-size="23"
          font-weight="bold" fill="#334155">TLS 복호화 검사 적용</text>

    <!-- Client and Server -->
    <rect x="45" y="310" width="130" height="55" rx="8"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="110" y="344" font-size="20" fill="#334155">Client</text>

    <rect x="585" y="445" width="130" height="55" rx="8"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="650" y="479" font-size="20" fill="#334155">Server</text>

    <!-- Inspection Device -->
    <rect x="265" y="260" width="230" height="250" rx="10"
          fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>

    <text x="380" y="288" font-size="20" font-weight="bold"
          fill="#1d4ed8">TLS 검사 장비</text>

    <!-- Decrypt -->
    <rect x="285" y="310" width="190" height="55" rx="7"
          fill="#dbeafe" stroke="#2563eb"/>
    <text x="380" y="333" font-size="19" font-weight="bold"
          fill="#1d4ed8">① 복호화</text>
    <text x="380" y="353" font-size="13" fill="#1e40af">
      암호화된 데이터 해석
    </text>

    <!-- Inspect -->
    <rect x="285" y="378" width="190" height="55" rx="7"
          fill="#fef3c7" stroke="#d97706"/>
    <text x="380" y="401" font-size="19" font-weight="bold"
          fill="#92400e">② 내용 검사</text>
    <text x="380" y="421" font-size="13" fill="#92400e">
      공격 패턴 및 위협 분석
    </text>

    <!-- Re-encrypt -->
    <rect x="285" y="445" width="190" height="55" rx="7"
          fill="#dbeafe" stroke="#2563eb"/>
    <text x="380" y="468" font-size="19" font-weight="bold"
          fill="#1d4ed8">③ 재암호화</text>
    <text x="380" y="488" font-size="13" fill="#1e40af">
      허용된 데이터 보호
    </text>

    <path d="M380 365 V375 M380 433 V442"
          stroke="#2563eb" stroke-width="2"
          marker-end="url(#blueArrow)"/>

    <!-- TLS Connections -->
    <path d="M175 337 H275" stroke="#16a34a"
          stroke-width="3" marker-end="url(#greenArrow)"/>

    <text x="220" y="324" font-size="14" font-weight="bold"
          fill="#15803d">TLS 연결 1</text>

    <path d="M475 472 H575" stroke="#16a34a"
          stroke-width="3" marker-end="url(#greenArrow)"/>

    <text x="530" y="459" font-size="14" font-weight="bold"
          fill="#15803d">TLS 연결 2</text>

    <text x="380" y="535" font-size="15" fill="#64748b">
      두 개의 TLS 연결을 이용해 허용된 트래픽을 검사 및 전달
    </text>

  </g>
</svg>
