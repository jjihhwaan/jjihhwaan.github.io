<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520">
  <rect width="760" height="520" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="720" height="480" rx="14" fill="#ffffff" stroke="#cbd5e1"/>

  <g font-family="Arial, sans-serif" text-anchor="middle">

    <!-- Network connections -->
    <path d="M320 109 V158
             M320 228 V285 H140 V330
             M320 285 V330
             M320 285 H500 V330"
          fill="none" stroke="#64748b" stroke-width="3"/>

    <!-- Internet -->
    <path d="M260 110
             C215 110 205 65 245 55
             C250 20 300 20 320 45
             C355 20 395 45 390 70
             C430 105 380 125 350 110 Z"
          fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>

    <text x="320" y="83" font-size="21" font-weight="bold" fill="#334155">Internet</text>

    <!-- Network Switch -->
    <rect x="205" y="158" width="230" height="70" rx="8" fill="#334155"/>
    <text x="320" y="184" font-size="18" font-weight="bold" fill="#ffffff">Network Switch</text>

    <g fill="#94a3b8">
      <rect x="225" y="195" width="17" height="15" rx="2"/>
      <rect x="252" y="195" width="17" height="15" rx="2"/>
      <rect x="279" y="195" width="17" height="15" rx="2"/>
      <rect x="306" y="195" width="17" height="15" rx="2"/>
      <rect x="333" y="195" width="17" height="15" rx="2"/>
      <rect x="360" y="195" width="17" height="15" rx="2"/>
      <rect x="387" y="195" width="17" height="15" rx="2"/>
    </g>

    <!-- Mirrored Traffic -->
    <path d="M435 193 H525" stroke="#16a34a"
          stroke-width="3" stroke-dasharray="7 5"/>
    <polygon points="535,193 525,188 525,198" fill="#16a34a"/>

    <text x="485" y="177" font-size="13" fill="#15803d">트래픽 복제</text>

    <!-- NIDS -->
    <rect x="535" y="145" width="175" height="98" rx="10"
          fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>

    <text x="622.5" y="180" font-size="25" font-weight="bold" fill="#15803d">NIDS</text>
    <text x="622.5" y="205" font-size="16" fill="#166534">패킷 수집 및 분석</text>
    <text x="622.5" y="226" font-size="14" fill="#166534">침입 탐지 · 경고</text>

    <!-- Original Traffic Label -->
    <text x="336" y="267" text-anchor="start"
          font-size="15" fill="#64748b">원본 네트워크 트래픽</text>

    <!-- Web Server -->
    <rect x="95" y="330" width="90" height="100" rx="7"
          fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>

    <g fill="#64748b">
      <rect x="105" y="342" width="70" height="19" rx="3"/>
      <rect x="105" y="370" width="70" height="19" rx="3"/>
      <rect x="105" y="398" width="70" height="19" rx="3"/>
    </g>

    <g fill="#4ade80">
      <circle cx="165" cy="351" r="4"/>
      <circle cx="165" cy="379" r="4"/>
      <circle cx="165" cy="407" r="4"/>
    </g>

    <text x="140" y="454" font-size="18" font-weight="bold" fill="#334155">Web Server</text>

    <!-- DB Server -->
    <rect x="275" y="330" width="90" height="100" rx="7"
          fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>

    <g fill="#64748b">
      <rect x="285" y="342" width="70" height="19" rx="3"/>
      <rect x="285" y="370" width="70" height="19" rx="3"/>
      <rect x="285" y="398" width="70" height="19" rx="3"/>
    </g>

    <g fill="#4ade80">
      <circle cx="345" cy="351" r="4"/>
      <circle cx="345" cy="379" r="4"/>
      <circle cx="345" cy="407" r="4"/>
    </g>

    <text x="320" y="454" font-size="18" font-weight="bold" fill="#334155">DB Server</text>

    <!-- Employee PC -->
    <rect x="445" y="330" width="110" height="76" rx="6" fill="#334155"/>
    <rect x="453" y="338" width="94" height="60" rx="3" fill="#dbeafe"/>
    <path d="M500 406 V424 M475 424 H525" stroke="#64748b" stroke-width="5"/>

    <text x="500" y="454" font-size="18" font-weight="bold" fill="#334155">Employee PC</text>

  </g>
</svg>
