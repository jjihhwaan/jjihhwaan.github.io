<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720">
  <rect width="760" height="720" rx="16" fill="#f8fafc"/>

  <defs>
    <g id="server">
      <rect width="70" height="75" rx="6"
            fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
      <g fill="#64748b">
        <rect x="8" y="9" width="54" height="15" rx="3"/>
        <rect x="8" y="30" width="54" height="15" rx="3"/>
        <rect x="8" y="51" width="54" height="15" rx="3"/>
      </g>
      <g fill="#4ade80">
        <circle cx="54" cy="16" r="3"/>
        <circle cx="54" cy="37" r="3"/>
        <circle cx="54" cy="58" r="3"/>
      </g>
    </g>

    <g id="firewall">
      <rect width="200" height="52" rx="6" fill="#334155"/>
      <g stroke="#94a3b8" stroke-width="1.5">
        <path d="M10 17 H190 M10 35 H190"/>
        <path d="M55 0 V17 M100 0 V17 M145 0 V17"/>
        <path d="M32 17 V35 M78 17 V35 M122 17 V35 M168 17 V35"/>
        <path d="M55 35 V52 M100 35 V52 M145 35 V52"/>
      </g>
    </g>
  </defs>

  <g font-family="Arial, sans-serif" text-anchor="middle">

    <!-- Internet -->
    <rect x="240" y="20" width="280" height="50" rx="10"
          fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="380" y="51" font-size="23" font-weight="bold"
          fill="#334155">Internet</text>

    <path d="M380 70 V100" stroke="#64748b" stroke-width="3"/>

    <!-- External Firewall -->
    <use href="#firewall" x="280" y="100"/>

    <text x="505" y="121" text-anchor="start"
          font-size="18" font-weight="bold" fill="#334155">외부 방화벽</text>
    <text x="505" y="143" text-anchor="start"
          font-size="13" fill="#64748b">공개 서비스 접근 제어</text>

    <path d="M380 152 V180" stroke="#64748b" stroke-width="3"/>

    <!-- DMZ Zone -->
    <rect x="30" y="180" width="700" height="220" rx="12"
          fill="#fffbeb" stroke="#d97706" stroke-width="2"/>

    <text x="55" y="212" text-anchor="start"
          font-size="24" font-weight="bold" fill="#92400e">DMZ</text>
    <text x="55" y="235" text-anchor="start"
          font-size="15" fill="#92400e">외부에 공개되는 서비스 구역</text>

    <!-- DMZ Network Connections -->
    <path d="M380 180 V250
             M380 285 V297 H155 V310
             M380 297 V310
             M380 297 H605 V310"
          fill="none" stroke="#64748b" stroke-width="2"/>

    <rect x="295" y="250" width="170" height="35" rx="6"
          fill="#334155"/>
    <text x="380" y="273" font-size="15" fill="#ffffff">DMZ Switch</text>

    <!-- Public Servers -->
    <use href="#server" transform="translate(130.5 310) scale(0.7)"/>
    <use href="#server" transform="translate(355.5 310) scale(0.7)"/>
    <use href="#server" transform="translate(580.5 310) scale(0.7)"/>

    <g font-size="16" font-weight="bold" fill="#334155">
      <text x="155" y="386">Web Server</text>
      <text x="380" y="386">DNS Server</text>
      <text x="605" y="386">Mail Server</text>
    </g>

    <!-- Internal Firewall -->
    <path d="M465 267 H690 V410 H380 V430"
          fill="none" stroke="#64748b" stroke-width="2"/>

    <use href="#firewall" x="280" y="430"/>

    <text x="505" y="451" text-anchor="start"
          font-size="18" font-weight="bold" fill="#334155">내부 방화벽</text>
    <text x="505" y="473" text-anchor="start"
          font-size="13" fill="#64748b">필요한 통신만 허용</text>

    <path d="M380 482 V510" stroke="#64748b" stroke-width="3"/>

    <!-- Internal Zone -->
    <rect x="30" y="510" width="700" height="190" rx="12"
          fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>

    <text x="55" y="542" text-anchor="start"
          font-size="23" font-weight="bold" fill="#1d4ed8">내부 네트워크</text>

    <!-- Internal Network Connections -->
    <path d="M380 510 V555
             M380 585 V595 H155 V606
             M380 595 V606
             M380 595 H605 V606"
          fill="none" stroke="#64748b" stroke-width="2"/>

    <rect x="295" y="555" width="170" height="30" rx="5"
          fill="#334155"/>
    <text x="380" y="575" font-size="14" fill="#ffffff">Internal Switch</text>

    <!-- DB Server -->
    <path d="M133 614 V646 Q155 662 177 646 V614"
          fill="#94a3b8" stroke="#64748b"/>
    <ellipse cx="155" cy="614" rx="22" ry="8"
             fill="#cbd5e1" stroke="#64748b"/>

    <!-- Employee PC -->
    <rect x="340" y="606" width="80" height="44" rx="5"
          fill="#334155"/>
    <rect x="346" y="612" width="68" height="32" rx="2"
          fill="#dbeafe"/>
    <path d="M380 650 V660 M360 660 H400"
          stroke="#64748b" stroke-width="3"/>

    <!-- Application Server -->
    <rect x="575" y="606" width="60" height="54" rx="5"
          fill="#e2e8f0" stroke="#64748b"/>

    <g fill="#64748b">
      <rect x="582" y="612" width="46" height="11" rx="2"/>
      <rect x="582" y="628" width="46" height="11" rx="2"/>
      <rect x="582" y="644" width="46" height="11" rx="2"/>
    </g>

    <g font-size="16" font-weight="bold" fill="#334155">
      <text x="155" y="684">DB Server</text>
      <text x="380" y="684">Employee PC</text>
      <text x="605" y="684">업무 시스템</text>
    </g>

  </g>
</svg>
