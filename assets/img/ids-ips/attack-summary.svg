<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360">
  <rect width="760" height="360" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="720" height="320" rx="14" fill="#ffffff" stroke="#cbd5e1"/>

  <g font-family="Arial, sans-serif">
    <text x="40" y="58" font-size="24" font-weight="bold" fill="#1e293b">공격 시도 처리 결과 (가상 사례)</text>
    <text x="40" y="84" font-size="14" fill="#64748b">하루 동안 발생한 10,000건의 공격 시도 중 방화벽 단계에서 대부분이 차단된 상황을 단순화해 표현한 예시</text>

    <!-- Summary cards -->
    <rect x="40" y="108" width="210" height="80" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="60" y="136" font-size="15" fill="#475569">총 공격 시도</text>
    <text x="60" y="170" font-size="30" font-weight="bold" fill="#334155">10,000건</text>

    <rect x="270" y="108" width="210" height="80" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="290" y="136" font-size="15" fill="#475569">방화벽에서 차단</text>
    <text x="290" y="170" font-size="30" font-weight="bold" fill="#1d4ed8">9,900건</text>

    <rect x="500" y="108" width="210" height="80" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="520" y="136" font-size="15" fill="#475569">방화벽 통과</text>
    <text x="520" y="170" font-size="30" font-weight="bold" fill="#c2410c">100건</text>

    <!-- Stacked bar -->
    <text x="40" y="225" font-size="17" font-weight="bold" fill="#334155">비율 비교</text>
    <rect x="40" y="242" width="680" height="42" rx="8" fill="#e5e7eb"/>
    <rect x="40" y="242" width="673.2" height="42" rx="8" fill="#c7d2fe"/>
    <rect x="713.2" y="242" width="6.8" height="42" rx="0" fill="#fed7aa"/>

    <text x="360" y="269" font-size="20" font-weight="bold" text-anchor="middle" fill="#3730a3">99%</text>
    <text x="700" y="269" font-size="12" font-weight="bold" text-anchor="end" fill="#9a3412">1%</text>

    <!-- Legend -->
    <rect x="40" y="304" width="16" height="16" rx="3" fill="#c7d2fe"/>
    <text x="64" y="317" font-size="15" fill="#334155">방화벽에서 차단 — 9,900건</text>

    <rect x="280" y="304" width="16" height="16" rx="3" fill="#fed7aa"/>
    <text x="304" y="317" font-size="15" fill="#334155">방화벽 통과 — 100건</text>
  </g>
</svg>
