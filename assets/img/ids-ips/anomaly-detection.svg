<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420">
  <rect width="760" height="420" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="720" height="380" rx="14" fill="#ffffff" stroke="#cbd5e1"/>

  <g font-family="Arial, sans-serif">

    <!-- Title -->
    <text x="380" y="53" text-anchor="middle" font-size="23" font-weight="bold" fill="#1e293b">Anomaly-based Detection</text>

    <!-- Grid -->
    <g stroke="#e2e8f0" stroke-width="1">
      <path d="M85 100 H700"/>
      <path d="M85 150 H700"/>
      <path d="M85 200 H700"/>
      <path d="M85 250 H700"/>
      <path d="M85 300 H700"/>
    </g>

    <!-- Normal Range -->
    <rect x="85" y="230" width="615" height="70" fill="#dcfce7"/>
    <path d="M85 230 H700" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="105" y="220" font-size="16" font-weight="bold" fill="#15803d">정상 트래픽 범위</text>

    <!-- Axes -->
    <path d="M85 85 V320 H705" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="48" y="205" font-size="17" text-anchor="middle" transform="rotate(-90 48 205)" fill="#334155">트래픽 양</text>
    <text x="395" y="350" font-size="17" text-anchor="middle" fill="#334155">시간 (Time)</text>

    <!-- Normal Traffic -->
    <polyline
      points="85,270 125,258 165,280 205,250 245,265 285,245 325,275 365,260 405,250"
      fill="none" stroke="#16a34a" stroke-width="4"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Anomalous Traffic -->
    <polyline
      points="405,250 440,195 475,120 510,155 550,95 590,140 630,110 690,145"
      fill="none" stroke="#dc2626" stroke-width="4"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Alert Point -->
    <circle cx="440" cy="195" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
    <path d="M440 195 V105" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="365" y="72" width="150" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="440" y="94" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">이상 징후 탐지</text>

    <!-- Legend -->
    <path d="M145 378 H180" stroke="#16a34a" stroke-width="4"/>
    <text x="190" y="383" font-size="15" fill="#334155">정상 트래픽</text>

    <path d="M420 378 H455" stroke="#dc2626" stroke-width="4"/>
    <text x="465" y="383" font-size="15" fill="#334155">비정상 트래픽</text>

  </g>
</svg>
