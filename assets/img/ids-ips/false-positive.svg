<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560">
  <rect width="760" height="560" rx="16" fill="#f8fafc"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif" text-anchor="middle">

    <!-- Common Situation -->
    <rect x="150" y="20" width="460" height="80" rx="10"
          fill="#ffffff" stroke="#94a3b8"/>

    <text x="380" y="49" font-size="22" font-weight="bold" fill="#1e293b">대학교 수강신청 시작</text>
    <text x="380" y="77" font-size="17" fill="#475569">정상적인 학생들의 접속량 급증</text>

    <path d="M380 100 V123" stroke="#64748b" stroke-width="2"
          marker-end="url(#arrow)"/>

    <!-- False Positive -->
    <rect x="190" y="130" width="380" height="60" rx="8"
          fill="#fef3c7" stroke="#d97706" stroke-width="2"/>

    <text x="380" y="155" font-size="20" font-weight="bold" fill="#92400e">False Positive (오탐)</text>
    <text x="380" y="177" font-size="15" fill="#92400e">정상 트래픽을 공격으로 잘못 판단</text>

    <!-- Branch -->
    <path d="M380 190 V210 H195 V232
             M380 210 H565 V232"
          fill="none" stroke="#64748b" stroke-width="2"
          marker-end="url(#arrow)"/>

    <!-- IDS Panel -->
    <rect x="20" y="240" width="350" height="300" rx="12"
          fill="#ffffff" stroke="#cbd5e1"/>

    <rect x="35" y="255" width="320" height="48" rx="7"
          fill="#dbeafe"/>

    <text x="195" y="286" font-size="24" font-weight="bold" fill="#1d4ed8">IDS</text>

    <rect x="55" y="325" width="280" height="60" rx="8"
          fill="#fef3c7" stroke="#d97706"/>

    <text x="195" y="350" font-size="19" font-weight="bold" fill="#92400e">경고 및 로그 생성</text>
    <text x="195" y="372" font-size="14" fill="#92400e">관리자가 탐지 결과를 확인</text>

    <path d="M195 385 V411" stroke="#64748b" stroke-width="2"
          marker-end="url(#arrow)"/>

    <rect x="55" y="420" width="280" height="90" rx="8"
          fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>

    <circle cx="195" cy="442" r="12" fill="#16a34a"/>
    <path d="M189 442 L193 446 L201 437"
          fill="none" stroke="#ffffff" stroke-width="3"/>

    <text x="195" y="477" font-size="20" font-weight="bold" fill="#166534">수강신청 가능</text>
    <text x="195" y="497" font-size="14" fill="#166534">정상 트래픽 전달 유지</text>

    <!-- IPS Panel -->
    <rect x="390" y="240" width="350" height="300" rx="12"
          fill="#ffffff" stroke="#cbd5e1"/>

    <rect x="405" y="255" width="320" height="48" rx="7"
          fill="#dcfce7"/>

    <text x="565" y="286" font-size="24" font-weight="bold" fill="#15803d">IPS</text>

    <rect x="425" y="325" width="280" height="60" rx="8"
          fill="#fef3c7" stroke="#d97706"/>

    <text x="565" y="350" font-size="19" font-weight="bold" fill="#92400e">차단 정책 적용</text>
    <text x="565" y="372" font-size="14" fill="#92400e">정상 요청까지 차단</text>

    <path d="M565 385 V411" stroke="#64748b" stroke-width="2"
          marker-end="url(#arrow)"/>

    <rect x="425" y="420" width="280" height="90" rx="8"
          fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>

    <circle cx="565" cy="442" r="12" fill="#dc2626"/>
    <path d="M560 437 L570 447 M570 437 L560 447"
          stroke="#ffffff" stroke-width="3"/>

    <text x="565" y="477" font-size="20" font-weight="bold" fill="#991b1b">수강신청 불가능</text>
    <text x="565" y="497" font-size="14" fill="#991b1b">서비스 가용성 저하</text>

  </g>
</svg>
