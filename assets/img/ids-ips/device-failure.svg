<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480">
  <rect width="760" height="480" rx="16" fill="#f8fafc"/>

  <g font-family="Arial, sans-serif" text-anchor="middle">

    <!-- IDS Panel -->
    <rect x="20" y="20" width="720" height="240" rx="12"
          fill="#ffffff" stroke="#cbd5e1"/>

    <text x="45" y="53" text-anchor="start" font-size="23"
          font-weight="bold" fill="#2563eb">IDS — 장비 장애</text>

    <rect x="50" y="85" width="140" height="55" rx="8"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="120" y="119" font-size="20" fill="#334155">Client</text>

    <rect x="310" y="85" width="140" height="55" rx="8"
          fill="#334155"/>
    <text x="380" y="119" font-size="20" fill="#ffffff">Switch</text>

    <rect x="570" y="85" width="140" height="55" rx="8"
          fill="#dcfce7" stroke="#16a34a"/>
    <text x="640" y="119" font-size="20" fill="#166534">Server</text>

    <g stroke="#16a34a" stroke-width="3" fill="none">
      <path d="M190 112 H300 L290 106 M300 112 L290 118"/>
      <path d="M450 112 H560 L550 106 M560 112 L550 118"/>
    </g>

    <text x="510" y="100" font-size="14" fill="#15803d">정상 전달</text>

    <path d="M380 140 V174" stroke="#94a3b8"
          stroke-width="2" stroke-dasharray="6 4"/>

    <rect x="285" y="174" width="190" height="45" rx="7"
          fill="#fee2e2" stroke="#dc2626"/>

    <text x="380" y="202" font-size="20" font-weight="bold"
          fill="#991b1b">IDS 장애 ✕</text>

    <text x="495" y="202" text-anchor="start" font-size="15"
          fill="#dc2626">탐지 기능 상실</text>

    <text x="380" y="244" font-size="18" font-weight="bold"
          fill="#15803d">원본 트래픽의 전달은 유지</text>

    <!-- IPS Panel -->
    <rect x="20" y="280" width="720" height="180" rx="12"
          fill="#ffffff" stroke="#cbd5e1"/>

    <text x="45" y="313" text-anchor="start" font-size="23"
          font-weight="bold" fill="#dc2626">IPS — 장비 장애</text>

    <rect x="50" y="340" width="140" height="55" rx="8"
          fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="120" y="374" font-size="20" fill="#334155">Client</text>

    <rect x="310" y="340" width="140" height="55" rx="8"
          fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="380" y="374" font-size="20" font-weight="bold"
          fill="#991b1b">IPS 장애 ✕</text>

    <rect x="570" y="340" width="140" height="55" rx="8"
          fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="640" y="374" font-size="20" fill="#94a3b8">Server</text>

    <path d="M190 367 H300 L290 361 M300 367 L290 373"
          stroke="#64748b" stroke-width="3" fill="none"/>

    <path d="M450 367 H500 M520 367 H570"
          stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>

    <path d="M502 358 L518 376 M518 358 L502 376"
          stroke="#dc2626" stroke-width="4"/>

    <text x="380" y="425" font-size="18" font-weight="bold"
          fill="#991b1b">정상적인 네트워크 통신도 중단될 수 있음</text>

    <text x="380" y="447" font-size="13" fill="#64748b">
      Fail-closed 방식으로 동작하는 경우
    </text>

  </g>
